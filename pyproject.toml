[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot360"
version = "1.0.0"
description = "Bot de Automatización INPEC - Gestión de Agendas y Historias Clínicas"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Bot360 Team", email = "team@bot360.local"}
]
keywords = ["bot", "automation", "selenium", "inpec", "agenda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Windows",
]

dependencies = [
    "flask==3.0.0",
    "selenium==4.15.2",
    "webdriver-manager==4.0.1",
    "pandas==2.1.4",
    "openpyxl==3.1.2",
    "requests==2.31.0",
    "pymupdf==1.23.8",
    "urllib3==2.1.0",
    "python-dotenv==1.0.0",
    "PyQt6==6.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "flake8==6.1.0",
    "mypy==1.7.0",
]
build = [
    "pyinstaller==6.3.0",
    "pyinstaller-hooks-contrib==2023.11",
]

[project.urls]
"Homepage" = "https://github.com/tu-usuario/bot360"
"Bug Tracker" = "https://github.com/tu-usuario/bot360/issues"
"Documentation" = "https://github.com/tu-usuario/bot360/wiki"

[tool.setuptools]
packages = ["src.agenda_app", "src.bot360_app", "src.ui"]
include-package-data = true

[tool.setuptools.package-data]
bot360 = ["config/*.json", "docs/*.md"]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
